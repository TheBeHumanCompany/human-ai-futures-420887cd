name: Nightly

# Everything that depends on a third-party service being up.
#
# These assertions are real and load-bearing — they are what detects the feed
# changing shape, or Sanity drifting from the committed snapshots — but they
# cannot gate a pull request without making CI a coin flip. Running them on a
# schedule keeps the signal and removes the false red from the PR path.
#
# A failure here is a drift report, not a broken build: the remedy is usually
# re-harvesting a snapshot and committing it.

on:
  schedule:
    # 07:00 UTC daily — after the show's usual publish window, before the
    # working day in America/Vancouver.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      # RUN_LIVE_TESTS flips the `describe.skipIf` guards, so this run includes
      # the offline suite AND every live assertion.
      - name: Test (offline + live)
        run: bun run test:live
