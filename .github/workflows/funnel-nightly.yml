name: Funnel nightly

# The funnel is intentionally excluded from PR CI: it drives Stripe TEST mode,
# a test Supabase project, and a Clerk dev instance. This workflow runs only
# the deterministic tier; real GTM and Resend checks require `test:funnel:live`
# locally with FUNNEL_LIVE=1.
#
# To use an isolated Stripe sandbox instead, run `stripe sandbox create`, then
# configure this workflow's same TEST-mode secrets for that sandbox. Do not add
# a second workflow for the sandbox variant.

on:
  schedule:
    # 07:00 UTC daily — aligned with the existing nightly integration checks.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: funnel-nightly
  cancel-in-progress: true

jobs:
  funnel:
    runs-on: ubuntu-latest
    env:
      PORT: 5180
      FUNNEL_STORE_PATH: e2e/funnel/fixtures/clients.json
      FUNNEL_RUN_ID: nightly-${{ github.run_id }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_AUDIT_PRICE_ID: ${{ secrets.STRIPE_AUDIT_PRICE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      FUNNEL_TEST_EMAIL: ${{ secrets.FUNNEL_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Set up Stripe CLI
        run: |
          if ! command -v stripe >/dev/null 2>&1; then
            brew install stripe/stripe-cli/stripe
          fi
          stripe --version

      - name: Run deterministic funnel smoke suite
        run: bun run test:funnel
